name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests (Laravel 13 & PHP 8.5)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_saas_test
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath, gd
          coverage: none

      - name: Install Composer Dependencies
        run: |
          cd apps/api
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run Backend Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: school_saas_test
          DB_USERNAME: runner
          DB_PASSWORD: secretpassword
          APP_KEY: base64:dGVzdGluZ2tleWZvcmdpdGh1YmFjdGlvbnMxMjM0NTY=
        run: |
          cd apps/api
          php artisan test

  frontend-build:
    name: Frontend Typecheck & Build (Nuxt 4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Build Frontend
        run: |
          cd apps/web
          npm run build
